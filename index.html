<script>
let currentLoadingPrice = 0;
let currentDrayage = 0;
let currentPMR = 0;

<!-- Update the customer rate change event -->
document.getElementById("customer").addEventListener("change", function () {
    const selectedOption = this.options[this.selectedIndex];

    currentLoadingPrice =
        parseFloat(selectedOption.dataset.price || 0);

    currentDrayage =
        parseFloat(selectedOption.dataset.drayage || 0);

    currentPMR =
        parseFloat(selectedOption.dataset.pmr || 0);
});




// ⭐ Clear fields on click of Submit
// Clear all input fields
function clearInputs() {
    document.getElementById("customer").value = "";
    document.getElementById("weight").value = "";
    document.getElementById("monthYear").value = "";
    document.getElementById("containers").value = "";
    document.getElementById("fuel").value = "";
    document.getElementById("storage").value = "";
}


// ⭐ Save row to Firebase
function saveRow(customer, weight, loadingPrice, loadingTotal, drayageTotal, monthYear) {
    db.ref("rows").push({
        Customer: customer || 0,
        Weight: weight || 0,
        LoadingPrice: loadingPrice || 0,
        LoadingTotal: loadingTotal || 0,
        DrayageTotal: drayageTotal || 0,
        MonthYear: monthYear || 0,
        timestamp: Date.now()
    });
}

<!-- Filter Function -->
function applyFilter() {
    const selectedCustomer = document.getElementById("filterCustomer").value;
    const selectedMonth = document.getElementById("filterMonth").value;

    db.ref("rows").once("value").then(snapshot => {
        const data = snapshot.val();
        const tbody = document.querySelector("#resultTable tbody");
        tbody.innerHTML = "";

        for (let id in data) {
            const row = data[id];

            const matchCustomer = selectedCustomer === "" || row.Customer === selectedCustomer;
            const matchMonth = selectedMonth === "" || row.MonthYear === selectedMonth;

            // ⭐ Show row only if BOTH filters match
            if (matchCustomer && matchMonth) {
                const tr = document.createElement("tr");

                tr.innerHTML = `
                    <td>${row.Customer}</td>
                    <td>${row.Weight}</td>
                    <td>${row.LoadingPrice}</td>
                    <td>${row.LoadingTotal}</td>
                    <td>${row.DrayageTotal}</td>
                    <td>${row.MonthYear}</td>
                    <td><button onclick="deleteRow('${id}')">Delete</button></td>
                    <td><button onclick="editRow('${id}')">Edit</button></td>
                `;

                tbody.appendChild(tr);
            }
        }
    });
}
function clearFilter() {
    document.getElementById("filterMonth").value = "";
    loadRows();
}

function deleteRow(id) {
    const confirmDelete = confirm("Are you sure you want to delete this record?");

    if (!confirmDelete) return;   // user cancelled

    db.ref("rows/" + id).remove()
        .then(() => {
            alert("Record deleted successfully.");
        })
        .catch(error => {
            alert("Error deleting record: " + error);
        });
}

function editRow(id) {
    db.ref("rows/" + id).once("value").then(snapshot => {
        const row = snapshot.val();

        const newWeight = prompt("Enter new weight:", row.Weight);
        if (newWeight === null) return;

        const newMonth = prompt("Enter new Month-Year:", row.MonthYear);
        if (newMonth === null) return;

        const loadingTotal = row.LoadingPrice * parseFloat(newWeight);

        db.ref("rows/" + id).update({
            Weight: parseFloat(newWeight),
            LoadingTotal: loadingTotal.toFixed(2),
            MonthYear: newMonth
        });
    });
}


</script>

const db = firebase.database();
let ratesCache = {};
const customerNames = [
    "Meadowlake",
    "MercerPeace",
	"MercerCelgar",
    "MillarWesternWhitecourt",
    "MillarWesternSlavelake",
	"MillarWesternQuesnel",
    "Skook",
    "Kruger",
	"Mondi",
    "WestFraser/Cariboo"
];
function populateRateCustomerDropdown() {
    const customerSelect =
        document.getElementById("rateCustomer");

    const currentValue = customerSelect.value;

    customerSelect.innerHTML = `
        <option value="">-- Select Customer --</option>
    `;

    customerNames
        .sort((a, b) => a.localeCompare(b))
        .forEach(customerName => {
            const option = document.createElement("option");

            option.value = customerName;
            option.textContent = customerName;

            customerSelect.appendChild(option);
        });

    // Preserve the selected customer while editing
    if (
        customerNames.includes(currentValue)
    ) {
        customerSelect.value = currentValue;
    }
}
function loadRates() {
    db.ref("rates").once("value")
        .then(snapshot => {
            ratesCache = snapshot.val() || {};
            renderRatesTable();
            populateCustomerDropdown();
        })
        .catch(error => {
            console.error("Error loading rates:", error);
            document.getElementById("ratesTableContainer").innerHTML =
                "<p>Unable to load rates.</p>";
        });
}

function renderRatesTable() {
    const container = document.getElementById("ratesTableContainer");

    const rateIds = Object.keys(ratesCache);

    if (rateIds.length === 0) {
        container.innerHTML = "<p>No rates have been added yet.</p>";
        return;
    }

    const table = document.createElement("table");

    table.innerHTML = `
        <thead>
            <tr>
                <th>Customer</th>
                <th>Loading Rate</th>
                <th>Drayage Rate</th>
                <th>PMR Rate</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    `;

    const tbody = table.querySelector("tbody");

    rateIds
        .sort((a, b) => {
            return ratesCache[a].customer.localeCompare(
                ratesCache[b].customer
            );
        })
        .forEach(rateId => {
            const rate = ratesCache[rateId];
            const tr = document.createElement("tr");

            tr.innerHTML = `
                <td>${escapeHtml(rate.customer)}</td>
                <td>${Number(rate.loading || 0).toFixed(2)}</td>
                <td>${Number(rate.drayage || 0).toFixed(2)}</td>
                <td>${Number(rate.pmr || 0).toFixed(2)}</td>
                <td>
                    <button
                        class="rate-action-btn rate-edit-btn"
                        onclick="editRate('${rateId}')">
                        Edit
                    </button>

                    <button
                        class="rate-action-btn rate-delete-btn"
                        onclick="deleteRate('${rateId}')">
                        Delete
                    </button>
                </td>
            `;

            tbody.appendChild(tr);
        });

    container.innerHTML = "";
    container.appendChild(table);
}

    if (!customerSelect) return;

    const previousValue = customerSelect.value;

    customerSelect.innerHTML = `
        <option value="">-- Select Customer --</option>
    `;

    Object.keys(ratesCache)
        .sort((a, b) => {
            return ratesCache[a].customer.localeCompare(
                ratesCache[b].customer
            );
        })
        .forEach(rateId => {
            const rate = ratesCache[rateId];

            const option = document.createElement("option");
            option.value = rate.customer;
            option.textContent = rate.customer;

            option.dataset.price = rate.loading || 0;
            option.dataset.drayage = rate.drayage || 0;
            option.dataset.pmr = rate.pmr || 0;
            option.dataset.rateId = rateId;

            customerSelect.appendChild(option);
        });

    if (
        [...customerSelect.options].some(
            option => option.value === previousValue
        )
    ) {
        customerSelect.value = previousValue;
    }
}

document.getElementById("saveRateBtn").addEventListener("click", function () {
    const customer = document
        .getElementById("rateCustomer")
        .value
        .trim();

    const loading = parseFloat(
        document.getElementById("rateLoading").value
    );

    const drayage = parseFloat(
        document.getElementById("rateDrayage").value
    );

    const pmr = parseFloat(
        document.getElementById("ratePMR").value
    );

    const editingRateId =
        document.getElementById("editingRateId").value;

    if (!customer) {
        alert("Customer name is required.");
        return;
    }

    if (
        isNaN(loading) ||
        isNaN(drayage) ||
        isNaN(pmr)
    ) {
        alert("Please enter valid Loading, Drayage, and PMR rates.");
        return;
    }

    const rateData = {
        customer: customer,
        loading: loading,
        drayage: drayage,
        pmr: pmr,
        updatedAt: Date.now()
    };

    let saveRequest;

    if (editingRateId) {
        saveRequest = db
            .ref("rates/" + editingRateId)
            .update(rateData);
    } else {
        const existingRate = Object.values(ratesCache).find(rate => {
            return rate.customer.toLowerCase() === customer.toLowerCase();
        });

        if (existingRate) {
            alert("A rate already exists for this customer.");
            return;
        }

        saveRequest = db.ref("rates").push({
            ...rateData,
            createdAt: Date.now()
        });
    }

    saveRequest
        .then(() => {
            alert(editingRateId ? "Rate updated." : "Rate added.");

            clearRateForm();
            loadRates();
        })
        .catch(error => {
            console.error(error);
            alert("Unable to save rate.");
        });
});

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ⭐ Load rows into table */
function loadRows() {
    db.ref("rows").once("value").then(snapshot => {
        const data = snapshot.val();

        const selectedYear = document.getElementById("yearFilter").value;

        const container = document.getElementById("resultTableContainer");
        container.innerHTML = "";   // clear old tables

        const grouped = {};

        // ⭐ GROUP BY CUSTOMER
        for (let id in data) {
            const row = data[id];
            const customer = row.Customer;

            // ⭐ Extract year from MonthYear (e.g., "2026-09")
            const rowYear = row.MonthYear.split("-")[0];

            // ⭐ Apply year filter
            if (selectedYear && selectedYear !== "" && rowYear !== selectedYear) {
                continue;
            }

            if (!grouped[customer]) {
                grouped[customer] = [];
            }

				grouped[customer].push({
					MonthYear: row.MonthYear,
					LoadingRate: parseFloat(row.LoadingPrice || 0),
					Weight: parseFloat(row.Weight || 0),
					Containers: parseFloat(row.Containers || 0),
					FuelSurcharge: parseFloat(row.Fuel || 0),
					TotalLoading: parseFloat(row.LoadingTotal || 0),
					TotalDrayage: parseFloat(row.DrayageTotal || 0),
					Storage: parseFloat(row.Storage || 0),
					TotalCharge: (
						parseFloat(row.LoadingTotal || 0) +
						parseFloat(row.DrayageTotal || 0) +
						parseFloat(row.Storage || 0)
					)
				});



        }

        // ⭐ BUILD SEPARATE TABLES FOR EACH CUSTOMER
        Object.keys(grouped).forEach(customer => {

            grouped[customer].sort((a, b) => b.MonthYear.localeCompare(a.MonthYear));

            const tableWrapper = document.createElement("div");
            tableWrapper.style.marginBottom = "25px";

            const title = document.createElement("h3");
            title.textContent = customer;
            tableWrapper.appendChild(title);

            const table = document.createElement("table");
            table.className = "resultTable";

            table.innerHTML = `
                <thead>
                    <tr>
                        <th>Month-Year</th>
                        <th>Loading Rate</th>
                        <th>Total Weight</th>
                        <th>Total Loading</th>
                        <th>No of Containers</th>
                        <th>FS (%)</th>
                        <th>Total Drayage</th>
						<th>Total Storage</th>
						<th>Total Charge</th>
                    </tr>
                </thead>
                <tbody></tbody>
            `;

            const tbody = table.querySelector("tbody");

            grouped[customer].forEach(row => {
                const tr = document.createElement("tr");

					tr.innerHTML = `
						<td>${row.MonthYear}</td>
						<td>${row.LoadingRate.toFixed(2)}</td>
						<td>${row.Weight.toFixed(2)}</td>
						<td>${row.TotalLoading.toFixed(2)}</td>
						<td>${row.Containers}</td>
						<td>${row.FuelSurcharge}%</td>
						<td>${row.TotalDrayage.toFixed(2)}</td>
						<td>${row.Storage.toFixed(2)}</td>
						<td>${row.TotalCharge.toFixed(2)}</td>
					`;

                tbody.appendChild(tr);
            });

            tableWrapper.appendChild(table);
            container.appendChild(tableWrapper);
        });
    });
}
/* ⭐ Export Excel */
document.getElementById("exportExcelBtn").addEventListener("click", function () {

    const tables = document.querySelectorAll(".resultTable");

    if (tables.length === 0) {
        alert("No customer records available for export.");
        return;
    }

    // Combined data array for one sheet
    const combinedData = [];

    tables.forEach(table => {

        // Get customer name from <h3>
        const customerName = table.previousElementSibling.textContent.trim();

        // Add customer header
        combinedData.push([`Customer: ${customerName}`]);

        // Extract table rows
        const rows = table.querySelectorAll("tr");

        rows.forEach((tr, index) => {
            const cells = Array.from(tr.querySelectorAll("th, td")).map(cell => cell.textContent.trim());
            combinedData.push(cells);
        });

        // Add blank row between customers
        combinedData.push([]);
    });

    // Create workbook + worksheet
    const workbook = XLSX.utils.book_new();
    const worksheet = XLSX.utils.aoa_to_sheet(combinedData);

    // Add worksheet to workbook
    XLSX.utils.book_append_sheet(workbook, worksheet, "Customer Records");

    // Export file
    XLSX.writeFile(workbook, "Customer_Records.xlsx");
});

/* ⭐ Submit */
document.getElementById("submitBtn").addEventListener("click", function () {

    const customerSelect = document.getElementById("customer");
    const customer = customerSelect.value.trim();
    const monthYear = document.getElementById("monthYear").value.trim();

    // Numeric fields (null if empty)
    const weight = document.getElementById("weight").value === "" ? null : parseFloat(document.getElementById("weight").value);
    const containers = document.getElementById("containers").value === "" ? null : parseFloat(document.getElementById("containers").value);
    const fuel = document.getElementById("fuel").value === "" ? null : parseFloat(document.getElementById("fuel").value);
    const storage = document.getElementById("storage").value === "" ? null : parseFloat(document.getElementById("storage").value);

    const currentLoadingPrice = parseFloat(customerSelect.options[customerSelect.selectedIndex].dataset.price);
    const currentDrayage = parseFloat(customerSelect.options[customerSelect.selectedIndex].dataset.drayage);
    const currentPMR = parseFloat(customerSelect.options[customerSelect.selectedIndex].dataset.pmr) || 0;

    // Mandatory fields
    if (!customer || !monthYear) {
        alert("Customer and Calendar are required.");
        return;
    }

    // Validate numeric fields (must be >= 0 if provided)
    const invalidNumeric =
        (weight !== null && weight < 0) ||
        (containers !== null && containers < 0) ||
        (fuel !== null && fuel < 0) ||
        (storage !== null && storage < 0);

    if (invalidNumeric) {
        alert("Numeric fields must be greater than or equal to 0.");
        return;
    }

    // At least one numeric field must be provided
    const wantsAnyUpdate = weight !== null || containers !== null || fuel !== null || storage !== null;

    if (!wantsAnyUpdate) {
        alert("Enter Weight OR Fuel OR Containers OR Storage to update.");
        return;
    }

    // Check for duplicate record
    db.ref("rows").once("value").then(snapshot => {
        const data = snapshot.val() || {};
        let duplicateId = null;

        for (let id in data) {
            const row = data[id];
            if (row.Customer === customer && row.MonthYear === monthYear) {
                duplicateId = id;
                break;
            }
        }

        // ⭐ UPDATE EXISTING RECORD
        if (duplicateId) {

            const confirmUpdate = confirm(
                `A record already exists for ${customer} (${monthYear}).\nDo you want to update it?`
            );

            if (!confirmUpdate) return;

            db.ref("rows/" + duplicateId).once("value").then(snapshot => {
                const oldRow = snapshot.val();

                const updatePayload = {
                    Customer: customer,
                    MonthYear: monthYear,
                    timestamp: Date.now()
                };

                // Detect which fields user updated
                const wantsLoadingUpdate = weight !== null;
                const wantsDrayageUpdate = containers !== null || fuel !== null;
                const wantsStorageUpdate = storage !== null;

                // ⭐ Loading update
                if (wantsLoadingUpdate) {
                    updatePayload.Weight = weight;
                    updatePayload.LoadingPrice = currentLoadingPrice;
                    updatePayload.LoadingTotal = currentLoadingPrice * weight;
                } else {
                    updatePayload.Weight = oldRow.Weight;
                    updatePayload.LoadingPrice = oldRow.LoadingPrice;
                    updatePayload.LoadingTotal = oldRow.LoadingTotal;
                }

                // ⭐ Drayage update
                if (wantsDrayageUpdate) {
                    const effectiveContainers = containers !== null ? containers : oldRow.Containers;
                    const effectiveFuel = fuel !== null ? fuel : oldRow.Fuel;

                    updatePayload.Containers = effectiveContainers;
                    updatePayload.Fuel = effectiveFuel;

                    updatePayload.DrayageTotal =
                        (currentDrayage * effectiveContainers) +
                        (currentPMR * effectiveContainers) +
                        ((effectiveFuel / 100 * currentDrayage) * effectiveContainers);
                } else {
                    updatePayload.Containers = oldRow.Containers;
                    updatePayload.Fuel = oldRow.Fuel;
                    updatePayload.DrayageTotal = oldRow.DrayageTotal;
                }

                // ⭐ Storage update
                if (wantsStorageUpdate) {
                    updatePayload.Storage = storage;
                } else {
                    updatePayload.Storage = oldRow.Storage;
                }

                db.ref("rows/" + duplicateId).update(updatePayload);

                alert("Existing record updated.");
                clearInputs();
                loadRows();
                const selectedMonthYear = document.getElementById("monthFilter").value;
                generateCharts(selectedMonthYear);
            });

            return;
        }

        // ⭐ CREATE NEW RECORD
        const loadingTotal = weight !== null ? currentLoadingPrice * weight : 0;

        const drayageTotal = (containers !== null || fuel !== null)
            ? (currentDrayage * (containers || 0)) +
              (currentPMR * (containers || 0)) +
              (((fuel || 0) / 100 * currentDrayage) * (containers || 0))
            : 0;

        db.ref("rows").push({
            Customer: customer,
            Weight: weight || 0,
            LoadingPrice: currentLoadingPrice,
            LoadingTotal: loadingTotal,
            Fuel: fuel || 0,
            Containers: containers || 0,
            DrayageTotal: drayageTotal,
            Storage: storage || 0,
            MonthYear: monthYear,
            timestamp: Date.now()
        });

        alert("New record added.");
        clearInputs();
        loadRows();
        const selectedMonthYear = document.getElementById("monthFilter").value;
        generateCharts(selectedMonthYear);
    });
});
